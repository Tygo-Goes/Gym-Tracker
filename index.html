<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#e8590c">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171c;--mu:#6b7380;--ac:#e8590c;--ac2:#fff;--ln:#e3e6ea;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--card:#1a1d22;--tx:#eef0f3;--mu:#98a1ae;--ln:#2a2e35;--ok:#51cf66}}
:root[data-theme="dark"]{--bg:#0f1114;--card:#1a1d22;--tx:#eef0f3;--mu:#98a1ae;--ln:#2a2e35;--ok:#51cf66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:22px;margin:6px 4px 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{flex:1;white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-weight:650}
.pr{font-size:12px;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);border-radius:8px;padding:3px 8px;white-space:nowrap}
.last{color:var(--mu);font-size:14px;margin-top:4px}
.up{color:var(--ok)}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:10px;padding:8px;font-size:14px}
.row button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
form{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
form label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
form input{font-size:16px;padding:9px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);width:100%}
form .w{grid-column:1/3}
form .chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--tx)}
form .chk input{width:auto}
form button{grid-column:1/3;background:var(--ok);color:#fff;border:0;border-radius:10px;padding:11px;font-size:16px}
.ch{margin-top:10px}.ch svg{width:100%;height:auto;display:block}.ch .t{font-size:11px;fill:var(--mu)}.ch .v{font-size:12px;fill:var(--tx);font-weight:600}.ch p{font-size:12px;color:var(--mu);margin:4px 0 0}
.mv button{border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:8px;padding:4px 11px;margin-left:4px;font-size:14px}
.bw{display:flex;align-items:center;gap:8px;margin:2px 4px 8px;color:var(--mu);font-size:14px}.bw input{width:80px;font-size:16px;padding:7px;border:1px solid var(--ln);border-radius:9px;background:var(--card);color:var(--tx)}
.hist{margin-top:8px;font-size:14px}
.hist div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--ln)}
.hist i{font-style:normal;color:var(--mu)}
.hist b{color:var(--ac);font-weight:600}
.hist button{border:0;background:none;color:var(--mu);font-size:16px;padding:0 6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.s{opacity:1}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:18px}
</style></head><body><main>
<h1>🏋️ Gym Tracker</h1>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<div class="foot" id="foot"></div>
</main><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const DAYS=[
{t:"1 · Pull",ex:["Preacher Curl dumbbell","Rear Delt Fly","Hammer Curl dumbbell","Seated Row cable","Wide grip Lat Pulldown","Cable Wrist Curl"]},
{t:"2 · Push",ex:["Cable Tricep Pushdown","Pec Fly","Flat Bench Press","Shoulder Press dumbbells","Lateral Raise dumbbell"]},
{t:"3 · Core",ex:["Crunches","Rotary Torso","Plank"]},
{t:"4 · Core + Legs",ex:["Leg Press (plates)","Seated Calf Raises","Leg Curl","Back Extension","Abductor","Adductor","Ab Crunch","Ab Rotary Machine","Captains Chair"]}];
const SEED={"Preacher Curl dumbbell":[["27-08",59,8],["07-09",63,7],["28-09",16,6],["02-10",16,7],["05-10",18,6]],
"Rear Delt Fly":[["27-08",52,7],["07-09",59,11],["18-09",59,6],["02-10",66,6]],
"Hammer Curl dumbbell":[["27-08",12,8],["28-09",14,10],["02-10",16,8]],
"Seated Row cable":[["18-09",36,6]],
"Wide grip Lat Pulldown":[["27-08",52,7],["07-09",39,7]],
"Cable Wrist Curl":[["27-08",73,7],["18-09",91,8],["28-09",91,10]],
"Cable Tricep Pushdown":[["28-08",50,8],["25-09",68,7],["30-09",73,6]],
"Pec Fly":[["28-08",59,6],["25-09",73,9],["30-09",86,9],["05-10",93,6]],
"Flat Bench Press":[["25-09",60,8],["30-09",70,6],["05-10",70,7],["",75,1,1]],
"Shoulder Press dumbbells":[["28-08",14,7],["25-09",14,7],["30-09",16,7],["05-10",16,9]],
"Lateral Raise dumbbell":[["28-08",7,6],["25-09",7,10],["30-09",10,7],["05-10",10,8]],
"Crunches":[["02-10",64,9]],"Rotary Torso":[["02-10",64,11]],
"Plank":[["02-10","2:25 + 1:30"]],
"Leg Press (plates)":[["28-08",120,12],["21-09",180,7]],
"Seated Calf Raises":[["28-08",134,10],["21-09",134,14]],
"Leg Curl":[["28-08",68.3,9],["21-09",68.3,9]],
"Back Extension":[["28-08",93,8],["21-09",100,8]],
"Abductor":[["28-08",66,8],["21-09",66,9]],
"Adductor":[["28-08",73,9],["21-09",79,7]],
"Ab Crunch":[["28-08",50,9],["21-09",50,9],["25-09",54,10]],
"Ab Rotary Machine":[["28-08",36,8]],
"Captains Chair":[["25-09",0,14]]};
const SEEDT={"Preacher Curl dumbbell":[["02-10",8,7]],
"Rear Delt Fly":[["28-09",32,6],["02-10",32,8]],
"Hammer Curl dumbbell":[["28-09",8,6],["02-10",8,8]],
"Seated Row cable":[["02-10",32,8]],
"Cable Wrist Curl":[["27-08",73,7],["18-09",93,8]],
"Cable Tricep Pushdown":[["25-09",36,7],["30-09",32,7],["05-10",32,8]],
"Flat Bench Press":[["25-09",15,5],["30-09",20,7],["05-10",30,5]],
"Pec Fly":[["25-09",45,7],["30-09",52,6],["05-10",52,7]],
"Shoulder Press dumbbells":[["26-09",10,9],["30-09",10,9],["05-10",12,6]],
"Lateral Raise dumbbell":[["25-09",6,8],["30-09",6,8],["05-10",7,7]],
"Leg Press (plates)":[["28-08",120,12],["21-09",180,7]],
"Seated Calf Raises":[["28-08",134,10],["21-09",134,14]],
"Leg Curl":[["28-08",68.3,9],["21-09",68.3,9]],
"Back Extension":[["28-08",93,8],["21-09",100,8]],
"Abductor":[["28-08",66,8],["21-09",66,9]],
"Adductor":[["28-08",73,9],["21-09",79,7]],
"Ab Crunch":[["28-08",32,10],["21-09",32,10]],
"Ab Rotary Machine":[["28-08",32,8]]};
const AL={'Ab Crunch':'Crunches','Ab Rotary Machine':'Rotary Torso'},K=x=>AL[x]||x;
const $=s=>document.querySelector(s);
let S={e:[]},pick=0,tab=0,open={},ref=null,LS="gymtracker-v1";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=d=>d?d.slice(8)+"-"+d.slice(5,7)+"-"+d.slice(2,4):"datum onbekend";
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(src=SEED){const e=[];for(const k in src)for(const r of src[k]){const d=r[0]?"2026-"+r[0].split("-").reverse().join("-"):"";
 e.push(typeof r[1]=="string"?{id:uid(),x:K(k),d,t:r[1]}:{id:uid(),x:K(k),d,kg:r[1],r:r[2],rm:r[3]?1:0});}return e}
function toast(m){const t=$("#toast");t.textContent=m;t.className="s";setTimeout(()=>t.className="",2200)}
let saveT,user=null,authErr="";
function save(){if(!ref)return;clearTimeout(saveT);saveT=setTimeout(async()=>{try{await setDoc(ref,{e:S.e,n:S.n||"",c:S.c||[],o:S.o||{},h:S.h||[],bw:S.bw||0})}catch(e){toast("Opslaan mislukt")}},300)}
onAuthStateChanged(auth,async u=>{user=u;ref=null;S={e:[],c:[],o:{},h:[],bw:0};pick=0;
 if(u){const r=doc(db,"users",u.uid);try{const sn=await getDoc(r);ref=r;if(sn.exists()){S.e=sn.data().e||[];S.n=sn.data().n||"";S.c=sn.data().c||[];S.o=sn.data().o||{};S.h=sn.data().h||[];S.bw=sn.data().bw||0}else pick=1}catch(e){toast("Laden mislukt, ververs de pagina")}
  if(ref&&S.n=="Tim"&&!S.e.length&&!S.c.length){S.e=seed(SEEDT);save()}
  let mg=0;S.e.forEach(e=>{if(AL[e.x]){e.x=AL[e.x];mg=1}});if(mg)save()}
 $("#foot").innerHTML=u?`${u.email} · <a href="#" id="lo">uitloggen</a>`:"";render()});
const sets=x=>S.e.filter(e=>e.x==x&&!e.rm).sort((a,b)=>(b.d||"").localeCompare(a.d||""));
const better=(a,b)=>!b||a.kg>b.kg||(a.kg==b.kg&&a.r>b.r);
function best(x){let b=null;for(const e of S.e)if(e.x==x&&!e.rm&&e.kg!=null&&better(e,b))b=e;return b}
function chart(x){const h=sets(x).filter(e=>e.d).reverse().slice(-10);if(h.length<2)return `<div class="ch"><p>Log minstens 2 sets om een grafiek te zien.</p></div>`;
 const useR=h.every(e=>e.kg==h[0].kg),v=h.map(e=>useR?e.r:e.kg),mn=Math.min(...v),mx=Math.max(...v),W=300,H=130,pl=20,pr=20,pt=22,pb=34,rg=(mx-mn)||1;
 const X=i=>pl+i*(W-pl-pr)/(h.length-1),Y=y=>pt+(H-pt-pb)*(1-(y-mn)/rg);
 const pts=v.map((y,i)=>X(i)+","+Y(y)).join(" ");
 return `<div class="ch"><svg viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>`+
 h.map((e,i)=>`<circle cx="${X(i)}" cy="${Y(v[i])}" r="4" fill="var(--ac)"/><text class="v" x="${X(i)}" y="${Y(v[i])-8}" text-anchor="middle">${v[i]}</text><text class="t" x="${X(i)}" y="${H-18}" text-anchor="middle">${e.d.slice(8)}-${e.d.slice(5,7)}</text>`+(useR?"":`<text class="t" x="${X(i)}" y="${H-5}" text-anchor="middle">×${e.r}</text>`)).join("")+
 `</svg><p>${useR?"Reps per sessie":"Gewicht (kg) per sessie, reps eronder"} · laatste ${h.length}</p></div>`}
function card(nm){const x=K(nm),h=sets(x),rm=S.e.filter(e=>e.x==x&&e.rm).sort((a,b)=>b.kg-a.kg)[0],plank=x=="Plank",b=best(x),l=h[0],p=h[1];
 let pr=plank?"":(b?`PR ${b.kg} kg × ${b.r}`:"");if(rm)pr=(pr?pr+" · ":"")+`1RM ${rm.kg} kg`;
 let last="Nog niets gelogd";
 if(l){last=`Laatst: ${fmt(l.d)} · `+(plank?l.t:`${l.kg} kg × ${l.r}`);
  if(!plank&&p){const up=l.kg>p.kg||(l.kg==p.kg&&l.r>p.r);if(up)last+=` <span class="up">▲</span>`}}
 let est="",sug="";
 if(!plank){const E=e=>e.rm||e.r==1?e.kg:e.r<=12?e.kg*(1+e.r/30):0,m=Math.max(0,...S.e.filter(e=>e.x==x&&e.kg>0).map(E));
  if(m>0)est="Geschatte 1RM: "+Math.round(m)+" kg"+(S.bw>0?" · "+(m/S.bw).toFixed(2).replace(".",",")+"× lichaamsgewicht":"");
  if(l){const st=l.kg<20?1:l.kg<60?2.5:5;sug=l.kg==0?(l.r+1)+" reps":l.r>=10?(l.kg+st)+" kg × 6":l.kg+" kg × "+(l.r+1)}}
 const o=open[nm],f=o=="f"?`<form data-x="${nm}">`+(plank?`<label class="w">Tijd<input name="t" placeholder="2:25 + 1:30" required></label>`:
  `<label>Gewicht (kg)<input name="kg" type="number" inputmode="decimal" step="any" value="${l&&l.kg!=null?l.kg:""}" required></label><label>Reps<input name="r" type="number" inputmode="numeric" value="${l&&l.r||""}" required></label>`)+
  `<label class="w">Datum<input name="d" type="date" value="${today()}"></label><label class="w">Notitie (optioneel)<input name="nt" maxlength="80" placeholder="bijv. betere form"></label>`+(plank?"":`<label class="chk w"><input name="rm" type="checkbox"> Dit is een 1 rep max</label>`)+`<button>Opslaan</button></form>`:"";
 const cs=o=="c"?chart(x):"",hs=o=="h"?`<div class="hist">`+S.e.filter(e=>e.x==x).sort((a,b)=>(b.d||"").localeCompare(a.d||"")).map(e=>`<div><span>${fmt(e.d)}</span><span>${e.t||e.kg+" kg × "+e.r}${e.rm?" <b>1RM</b>":""}${e.nt?`<br><i>${e.nt}</i>`:""}</span><button data-del="${e.id}" aria-label="Verwijder">✕</button></div>`).join("")+`</div>`:"";
 return `<div class="card"><div class="top"><div class="nm">${nm}</div>${pr?`<div class="pr">${pr}</div>`:""}${ordering?`<span class="mv"><button data-mv="${nm}|-1">▲</button><button data-mv="${nm}|1">▼</button><button data-xd="${nm}" aria-label="Verwijder oefening">✕</button></span>`:""}</div><div class="last">${last}</div>${est?`<div class="last">${est}</div>`:""}${sug?`<div class="last">💡 Volgende keer: ${sug}</div>`:""}
 <div class="row"><button class="p" data-f="${nm}">+ Set</button><button data-h="${nm}">Historie (${S.e.filter(e=>e.x==x).length})</button>${plank?"":`<button data-c="${nm}">📈</button>`}</div>${f}${cs}${hs}</div>`}
let ordering=false;
function list(){const b=DAYS[tab].ex.filter(n=>!(S.h||[]).includes(n)).concat((S.c||[]).filter(c=>c.d==tab).map(c=>c.n)),o=(S.o||{})[tab]||[],p=a=>o.indexOf(a)<0?999+b.indexOf(a):o.indexOf(a);return b.slice().sort((x,y)=>p(x)-p(y))}
function start(n){S.n=n;S.e=n=="Tygo"?seed():n=="Tim"?seed(SEEDT):[];pick=0;save();render()}
function render(){if(!user){$("#tabs").innerHTML="";$("#list").innerHTML=`<div class="card"><div class="nm">Inloggen</div><form id="auth"><label class="w">E-mail<input name="m" type="email" required autocomplete="email"></label><label class="w">Wachtwoord (min. 6 tekens)<input name="p" type="password" minlength="6" required autocomplete="current-password"></label><button value="in">Inloggen</button><button value="new" style="background:var(--ac)">Account maken</button></form><div class="last">${authErr}</div></div>`;return}
 if(pick){$("#tabs").innerHTML="";$("#list").innerHTML=`<div class="card"><div class="nm">Wie ben je?</div><div class="last">Kies je naam, dan start je met je eigen schema. Wat je logt blijft alleen van jou.</div><div class="row"><button class="p" data-s="Tygo">Tygo</button><button class="p" data-s="Tim">Tim</button></div></div>`;return}
 document.querySelector("h1").textContent="🏋️ Gym Tracker"+(S.n?" · "+S.n:"");$("#tabs").innerHTML=DAYS.map((d,i)=>`<button class="${i==tab?"on":""}" data-t="${i}">${d.t}</button>`).join("");
 $("#list").innerHTML=`<div class="bw">⚖️ Lichaamsgewicht <input id="bw" type="number" inputmode="decimal" step="any" value="${S.bw||""}"> kg</div><div class="row" style="margin-top:0"><button data-ord="1">${ordering?"✓ Klaar":"✎ Aanpassen"}</button></div>`+list().map(card).join("")+`<div class="card"><form id="addx"><label class="w">Eigen oefening toevoegen aan deze dag<input name="n" placeholder="bijv. Biceps Curl cable" required maxlength="40"></label><button>+ Toevoegen</button></form></div>`}
document.addEventListener("click",ev=>{const t=ev.target;
 if(t.id=="lo"){ev.preventDefault();signOut(auth)}
 else if(t.dataset.ord){ordering=!ordering;render()}
 else if(t.dataset.mv){const[n,d]=t.dataset.mv.split("|"),l=list(),i=l.indexOf(n),j=i+ +d;if(j>=0&&j<l.length){[l[i],l[j]]=[l[j],l[i]];S.o=S.o||{};S.o[tab]=l;save();render()}}
 else if(t.dataset.xd){const n=t.dataset.xd;if(confirm("Deze oefening verwijderen? Je sets van deze oefening worden ook verwijderd.")){
  if((S.c||[]).some(c=>c.n==n))S.c=S.c.filter(c=>c.n!=n);else S.h=(S.h||[]).concat(n);
  const vis=DAYS.flatMap(d=>d.ex).filter(a=>!(S.h||[]).includes(a)).concat((S.c||[]).map(c=>c.n));
  if(!vis.some(a=>K(a)==K(n)))S.e=S.e.filter(e=>e.x!=K(n));save();render()}}
 else if(t.dataset.s){start(t.dataset.s)}
 else if(t.dataset.t!=null){tab=+t.dataset.t;render()}
 else if(t.dataset.f){open[t.dataset.f]=open[t.dataset.f]=="f"?0:"f";render()}
 else if(t.dataset.c){open[t.dataset.c]=open[t.dataset.c]=="c"?0:"c";render()}
 else if(t.dataset.h){open[t.dataset.h]=open[t.dataset.h]=="h"?0:"h";render()}
 else if(t.dataset.del&&confirm("Deze set verwijderen?")){S.e=S.e.filter(e=>e.id!=t.dataset.del);save();render()}});
document.addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target;
 if(f.id=="auth"){const v=Object.fromEntries(new FormData(f));authErr="";try{await(ev.submitter.value=="new"?createUserWithEmailAndPassword:signInWithEmailAndPassword)(auth,v.m,v.p)}catch(e){authErr="Mislukt ("+e.code.replace("auth/","")+")";render()}return}
 if(f.id=="addx"){const n=f.n.value.replace(/["<>&\\]/g,"").trim();const all=DAYS.flatMap(d=>d.ex).filter(a=>!(S.h||[]).includes(a)).concat((S.c||[]).map(c=>c.n));
  if(!n)return;if(all.some(a=>a.toLowerCase()==n.toLowerCase())){toast("Die oefening bestaat al");return}
  S.c=S.c||[];S.c.push({n,d:tab});save();render();toast("Oefening toegevoegd ✓");return}
 const nm=f.dataset.x,x=K(nm),v=Object.fromEntries(new FormData(f));
 const n={id:uid(),x,d:v.d||today()};if(v.nt&&v.nt.trim())n.nt=v.nt.replace(/["<>&]/g,"").trim();let msg="Opgeslagen ✓";
 if(v.t)n.t=v.t.trim();else{n.kg=parseFloat(String(v.kg).replace(",","."));n.r=parseInt(v.r);n.rm=v.rm?1:0;
  if(n.rm)msg="Nieuwe 1RM opgeslagen 🏆";else{const b=best(x);if(b&&better(n,b))msg="Nieuw PR! 🔥"}}
 S.e.push(n);open[nm]=0;save();render();toast(msg)});
document.addEventListener("change",ev=>{if(ev.target.id=="bw"){S.bw=parseFloat(String(ev.target.value).replace(",","."))||0;save();render();toast("Lichaamsgewicht opgeslagen ✓")}});
</script></body></html>
