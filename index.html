<script type="module">

let S={e:[]},pick=0,tab=0,open={},ref=null;

let user=null,authErr="";
async function save(checkLeaderboard=false){
 if(!ref)return;
 const account=user;

  // Replace each existing app field as a unit, including maps with removed entries.
  await setDoc(ref,data,{mergeFields:Object.keys(data)});
  if(checkLeaderboard&&!(await leaderboard)&&user===account)toast("Zichtbaarheid op het leaderboard kon niet worden bijgewerkt",5000);
 }catch(e){if(user===account)toast("Opslaan in Firebase mislukt",5000)}
}
onAuthStateChanged(auth,async u=>{
 user=u;ref=null;S={e:[],c:[],o:{},h:[],bw:0,ss:[],pn:{}};
 pick=0;tab=0;lastDay=0;strengthMuscle="chest";bodySide="front";strengthDate="";pulseMuscle="";prMoment=null;$("#pr-moment").hidden=true;$("#workout-summary")?.close();open={};ordering=false;lbD=[];authErr="";$("#toast").className="";
 if(u){
  pick="loading";render();
  const r=doc(db,"users",u.uid);
  try{
   const sn=await getDoc(r);
   if(user!==u)return;
   ref=r;pick=sn.exists()?0:1;
   if(sn.exists()){
    const d=sn.data();
    S={e:d.e||[],n:d.n||"",c:d.c||[],o:d.o||{},h:d.h||[],bw:d.bw||0,ss:d.ss||[],pn:d.pn||{},lb:d.lb!==false,shareSets:d.shareSets===true,days:(d.dy||[]).length?d.dy:undefined,bwh:d.bwh||[],xb:Number(d.xb)||0};

  }
  let changed=false;
  S.e.forEach(e=>{if(AL[e.x]){e.x=AL[e.x];changed=true}});
  const migrated=mig();

});
const sets=x=>S.e.filter(e=>e.x==x&&!e.rm).sort((a,b)=>(b.d||"").localeCompare(a.d||""));

 return `<article class="card exercise"><div class="top"><div class="exercise-title"><span class="exercise-icon">${icon(plank?"clock":"train")}</span><div><div class="nm">${esc(nm)}</div><small>${grp(x)}</small></div></div>${pr?`<div class="pr">${pr}</div>`:""}${ordering?`<span class="mv"><button aria-label="Omhoog verplaatsen" data-mv="${esc(nm)}|-1">▲</button><button aria-label="Omlaag verplaatsen" data-mv="${esc(nm)}|1">▼</button>${(S.c||[]).some(c=>c.n==nm)?`<button data-ty="${esc(nm)}" aria-label="Wissel tussen gewicht en tijd">⏱</button>`:""}<button data-xd="${esc(nm)}" aria-label="Verwijder oefening">✕</button></span>`:""}</div><div class="exercise-meta">${last}${est?`<div class="last">${est}</div>`:""}${sug?`<div class="last">Volgende keer · ${sug}</div>`:""}${!plank&&stag(x)?`<div class="last">3 trainingen hetzelfde. Probeer iets zwaarder of 1 rep extra.</div>`:""}</div>
 <div class="row"><button class="p" aria-expanded="${o=="f"}" data-f="${esc(nm)}">+ Set<span class="wide-action-label"> loggen</span></button>${l?`<button data-same="${esc(nm)}">Herhaal<span class="wide-action-label"> set</span></button>`:""}<button class="${o=="h"?"selected":""}" aria-expanded="${o=="h"}" data-h="${esc(nm)}">Historie</button>${plank?"":`<button class="icon-only ${o=="c"?"selected":""}" aria-expanded="${o=="c"}" aria-label="Grafiek" title="Grafiek" data-c="${esc(nm)}">${icon("stats")}</button>`}${!plank&&l&&l.kg>0?`<button class="icon-only ${o=="w"?"selected":""}" aria-expanded="${o=="w"}" aria-label="Warming-up" title="Warming-up" data-w="${esc(nm)}">${icon("flame")}</button>`:""}</div>${pn||ordering?`<button class="note" data-pn="${esc(nm)}">${pn?"📌 "+esc(pn):"+ Vaste notitie"}</button>`:""}${f}${cs}${wu}${hs}</article>`}
let wy=new Date().getFullYear();
const WL=["Jan – apr","Mei – aug","Sep – dec","Heel jaar"],nf=n=>Math.round(n).toLocaleString("nl-NL");
const rng=(y,p)=>{const a=p==3?1:p*4+1,b=p==3?12:p*4+4,z=n=>String(n).padStart(2,"0");return[y+"-"+z(a)+"-00",y+"-"+z(b)+"-32"]};
const inR=(e,r)=>e.d&&e.d>r[0]&&e.d<r[1];
function wview(){const ys=[...new Set(S.e.map(e=>e.d&&+e.d.slice(0,4)).filter(Boolean).concat(new Date().getFullYear()))].sort();
 return `<div class="panel-grid">`+lvCard()+sesCard()+`</div><div class="section-head"><h2>Jouw terugblik</h2></div><div class="row page-tools">${ys.map(y=>`<button data-wy="${y}" class="${y==wy?"p":""}">${y}</button>`).join("")}</div><div class="panel-grid">`+WL.map((l,p)=>{const r=rng(wy,p),n=S.e.filter(e=>inR(e,r)).length,on=today()>r[0]&&today()<r[1];
  return `<button class="card period" type="button" data-wp="${p}" ${n?"":"disabled"}><div class="top"><div class="nm">${l}</div>${on?`<div class="pr">loopt nog</div>`:""}</div><div class="last">${n} sets${n?" · Bekijk Wrapped":""}</div>${n?`<span class="period-arrow" aria-hidden="true">↗</span>`:""}</button>`}).join("")+"</div>"}
function story(p){const r=rng(wy,p),anyP=S.e.filter(e=>inR(e,r)),inP=anyP.filter(e=>!e.rm&&e.kg!=null).sort((a,b)=>a.d.localeCompare(b.d)),on=today()>r[0]&&today()<r[1],sets=anyP.length,days=new Set(anyP.map(e=>e.d)).size,vol=inP.reduce((t,e)=>t+(e.kg>0?e.kg*e.r:0),0);
 const pv=p==3?[wy-1,3]:p==0?[wy-1,2]:[wy,p-1],pc=S.e.filter(e=>inR(e,rng(pv[0],pv[1]))).length;
 const ses=(S.ss||[]).filter(e=>inR(e,r)),tm=ses.reduce((t,e)=>t+e.m,0);

 tmDraw();accountDraw();
 if(!ready){
  $("#tabs").innerHTML="";$("#hero").innerHTML="";
  if(!user)$("#list").innerHTML=guestCard("Inloggen",`<form id="auth"><label class="w">E-mail<input name="m" type="email" required autocomplete="email"></label><label class="w">Wachtwoord<input name="p" type="password" minlength="6" required autocomplete="current-password"></label><button value="in">Inloggen</button><button class="auth-secondary" value="new">Account maken</button><button class="auth-link" type="button" data-pw="1">Wachtwoord vergeten?</button></form>${authErr?`<p class="last" role="alert">${esc(authErr)}</p>`:""}`);
  else if(pick==="loading")$("#list").innerHTML=guestCard("Je schema laden…",'<p class="last" role="status">Verbinding maken met je account.</p>');
  else if(pick==="error")$("#list").innerHTML=guestCard("Je schema kon niet laden",'<div class="row"><button class="p" data-retry="1">Opnieuw proberen</button><button data-exit="1">Uitloggen</button></div>');
  else $("#list").innerHTML=guestCard("Welkom",`<p class="last">Met welke naam wil je in de app verschijnen?</p><form id="nm"><label class="w">Naam<input name="n" required maxlength="20" autocomplete="given-name"></label><button>Start</button></form>`);
  return;
 }
 const isDay=typeof tab==="number";
 if(isDay&&!D()[tab])tab=0;
 $("#date").textContent=new Intl.DateTimeFormat("nl-NL",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
 $("#tabs").innerHTML=`<button ${active(isDay)} data-t="train">${icon("train")} Trainen</button>`+Object.entries(pageInfo).map(([key,[glyph,name]])=>`<button ${active(tab===key)} data-t="${key}">${icon(glyph)} ${name}</button>`).join("");
 const x=xpOf(),level=lvOf(x),base=thr(level),next=thr(level+1);
 $("#hero").dataset.view=isDay?"train":tab;
 const title=isDay?D()[tab].t.replace(/^\d+\s*·\s*/,"")||D()[tab].t:pageInfo[tab][1];
 const subtitle=isDay?(S.n?"Welkom, "+S.n:"Kies je trainingsdag."):pageInfo[tab][2];
 const progress=Math.max(0,x-base),pct=progress/(next-base)*100;
 $("#hero").innerHTML=`<div class="hero-title"><h1 id="page-title">${esc(title)}</h1><p>${esc(subtitle)}</p></div>
 <div class="hero-progress"><div class="level-ring" style="--progress:${pct}%" role="progressbar" aria-label="Voortgang naar level ${level+1}" aria-valuemin="0" aria-valuemax="${next-base}" aria-valuenow="${progress}"><div><strong>${level}</strong><span>Level</span></div></div><div class="level-summary"><strong>${nf(x)} XP</strong><small>Nog ${nf(next-x)} XP</small></div></div>`;

 if(tab==="l")lbView();
 else $("#list").innerHTML=tab==="w"?wview():tab==="s"?statsView():tab==="k"?strengthView(S.e,Number(S.bw),K,strengthMuscle,bodySide,{today:today(),date:strengthDate||today(),weights:S.bwh||[]},pulseMuscle):dayTools();
 const updatedPicker=$("#list .day-picker");
 if(updatedPicker){
  updatedPicker.scrollLeft=dayScroll;
  const selected=updatedPicker.querySelector(".on");
  if(selected.offsetLeft<updatedPicker.scrollLeft||selected.offsetLeft+selected.offsetWidth>updatedPicker.scrollLeft+updatedPicker.clientWidth)
   updatedPicker.scrollLeft=selected.offsetLeft-5;
 }
 if(focus?.id==="strength-timeline")$("#strength-timeline")?.focus({preventScroll:true});
 if(focus?.matches("button[data-t],button[data-f],button[data-h],button[data-c],button[data-w],button[data-ord]")){
  const current=[...document.querySelectorAll("button")].find(button=>Object.entries(focus.dataset).every(([key,value])=>button.dataset[key]===value));
  current?.focus({preventScroll:true});
 }
}
document.addEventListener("click",async ev=>{const t=ev.target.closest("button,a,[data-wp],[data-wy],.muscle-region");if(!t||t.closest("#wr,#sc,#workout-summary"))return;const wp=t.closest("[data-wp]");if(wp){story(+wp.dataset.wp);return}const wb=t.closest("[data-wy]");if(wb){wy=+wb.dataset.wy;render();return}
 if(t.id=="lo"||t.dataset.exit){ev.preventDefault();signOut(auth).catch(()=>toast("Uitloggen mislukt"))}
 else if(t.dataset.retry){location.reload()}
 else if(t.dataset.strengthDate){
  strengthDate=t.dataset.strengthDate===today()?"":t.dataset.strengthDate;
  render();$("#strength-timeline")?.focus({preventScroll:true});
 }
 else if(t.dataset.prClose){prMoment=null;$("#pr-moment").hidden=true}
 else if(t.dataset.prMap&&prMoment?.muscle){
  strengthMuscle=prMoment.muscle.id;
  bodySide=prMoment.muscle.points.front?"front":"back";
  strengthDate="";tab="k";pulseMuscle=strengthMuscle;
  prMoment=null;$("#pr-moment").hidden=true;
  render();pulseMuscle="";
  $(".strength-stage").scrollIntoView({block:"start"});
 }
 else if(t.dataset.workoutId){
  const session=(S.ss||[]).find(item=>item.id===t.dataset.workoutId);
  if(session)showWorkoutSummary(session,S.e.filter(entry=>entry.sid===session.id));
 }
 else if(t.dataset.muscle){
  strengthMuscle=t.dataset.muscle;
  const selected=muscles.find(muscle=>muscle.id===strengthMuscle);
  if(!selected.points[bodySide])bodySide=selected.points.front?"front":"back";
  const model=t.closest(".body-model");
  if(model)bodySide=model.dataset.side;
  render();
  const target=model?`.body-model[data-side="${bodySide}"] .muscle-point`:".muscle-list button";
  $(`${target}[data-muscle="${strengthMuscle}"]`)?.focus({preventScroll:true});
 }
 else if(t.dataset.bodyView){
  bodySide=t.dataset.bodyView;render();
  $(`[data-body-view="${bodySide}"]`)?.focus({preventScroll:true});
 }
 else if(t.dataset.ord){ordering=!ordering;render()}
 else if(t.dataset.mv){const value=t.dataset.mv,n=value.slice(0,value.lastIndexOf("|")),d=value.slice(value.lastIndexOf("|")+1),l=D()[tab].ex,i=l.indexOf(n),j=i+ +d;if(j>=0&&j<l.length){[l[i],l[j]]=[l[j],l[i]];save();render()}}
 else if(t.dataset.ty){const c=S.c.find(c=>c.n==t.dataset.ty);if(c){c.t=c.t=="t"?"kg":"t";save();render();toast(c.t=="t"?"Nu op tijd":"Nu op gewicht × reps")}}
 else if(t.dataset.xd){const n=t.dataset.xd;if(confirm("Deze oefening verwijderen? Je sets van deze oefening worden ook verwijderd.")){
  const dd=D()[tab];dd.ex=dd.ex.filter(a=>a!=n);const vis=D().flatMap(d=>d.ex);
  if(!vis.includes(n))S.c=(S.c||[]).filter(c=>c.n!=n);
  if(!vis.some(a=>K(a)==K(n)))S.e=S.e.filter(e=>e.x!=K(n));save();render()}}
 else if(t.dataset.pw){const m=document.querySelector("#auth [name=m]").value.trim();if(!m)toast("Vul eerst je e-mail in");else sendPasswordResetEmail(auth,m).then(()=>toast("Mail om je wachtwoord te herstellen verstuurd (check ook spam)"),()=>toast("Versturen mislukt"))}
 else if(t.dataset.t!=null){const value=t.dataset.t;tab=value==="train"?lastDay:isNaN(value)?value:+value;if(typeof tab==="number")lastDay=tab;render();if(t.closest("#tabs"))window.scrollTo(0,0)}
 else if(t.dataset.sp){spW=t.dataset.sp;render()}
 else if(t.dataset.addday){if(D().length>=7)toast("Maximaal 7 dagen");else{const v=prompt("Naam van de nieuwe dag");const c=v&&v.replace(/["<>&\\]/g,"").trim().slice(0,20);if(c){S.days.push({t:c,ex:[]});tab=S.days.length-1;lastDay=tab;save();render()}}}
 else if(t.dataset.rn){const v=prompt("Naam van deze dag",D()[tab].t);const c=v&&v.replace(/["<>&\\]/g,"").trim().slice(0,20);if(c){D()[tab].t=c;save();render()}}
 else if(t.dataset.dd){if(D().length<2)toast("Je hebt minimaal 1 dag nodig");else if(confirm("Deze dag verwijderen? Je sets blijven bewaard.")){S.days.splice(tab,1);tab=0;lastDay=0;save();render()}}
 else if(t.dataset.ls){lbS=t.dataset.ls;lbDraw()}
 else if(t.dataset.sharesets){
   const account=user, state=S, previous=S.shareSets===true;t.disabled=true;S.shareSets=!previous;
   try{const b=writeBatch(db);b.set(ref,{shareSets:S.shareSets},{merge:true});
     b.set(doc(db,"leaderboard",user.uid),leaderboardData());await b.commit();
   }catch{state.shareSets=previous;toast("Delen wijzigen mislukt. Probeer opnieuw.");}
   if(user===account&&tab==="l")render();
 }
 else if(t.dataset.lbt){t.disabled=true;const account=user;S.lb=S.lb===false;save(true).then(()=>{if(user===account&&tab==="l")render()})}
 else if(t.dataset.ts){localStorage.setItem(timerKey(),Date.now());tmDraw();toast("Training gestart ⏱")}
 else if(t.dataset.te){finish()}
 else if(t.dataset.w){open[t.dataset.w]=open[t.dataset.w]=="w"?0:"w";render()}
 else if(t.dataset.pn){const k=K(t.dataset.pn),v=prompt("Vaste notitie voor deze oefening (leeg = verwijderen)",(S.pn||{})[k]||"");if(v!==null){S.pn=S.pn||{};const c=v.replace(/["<>&]/g,"").trim();if(c)S.pn[k]=c;else delete S.pn[k];save();render()}}
 else if(t.dataset.same){const nm=t.dataset.same,x=K(nm),l=sets(x)[0];if(l){const n={id:uid(),x,d:today()};if(l.t)n.t=l.t;else{n.kg=l.kg;n.r=l.r;n.rm=0}markSession(n);const xb=snap();S.e.push(n);save();render();const tp=tips(x,n);lvu(xb,tp);toast(["Zelfde als vorige keer opgeslagen ✓",...tp].join("\n"),tp.length?6000:2200)}}
 else if(t.dataset.f){open[t.dataset.f]=open[t.dataset.f]=="f"?0:"f";render();if(open[t.dataset.f]==="f"&&matchMedia("(pointer: fine)").matches)[...document.querySelectorAll("form[data-x]")].find(form=>form.dataset.x===t.dataset.f)?.querySelector("input")?.focus({preventScroll:true})}
 else if(t.dataset.c){open[t.dataset.c]=open[t.dataset.c]=="c"?0:"c";render()}
 else if(t.dataset.h){open[t.dataset.h]=open[t.dataset.h]=="h"?0:"h";render()}
 else if(t.dataset.del&&confirm("Deze set verwijderen?")){S.e=S.e.filter(e=>e.id!=t.dataset.del);save();render()}});
document.addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target;
 if(f.id=="auth"){const v=Object.fromEntries(new FormData(f)),creating=ev.submitter?.value==="new";
  const actions=[...f.querySelectorAll("button")];
  if(actions.some(button=>button.disabled))return;
  for(const button of actions)button.disabled=true;
  try{await(creating?createUserWithEmailAndPassword:signInWithEmailAndPassword)(auth,v.m.trim(),v.p)}
  catch(e){
   const errors={"auth/invalid-credential":"Controleer je e-mailadres en wachtwoord.","auth/email-already-in-use":"Dit e-mailadres heeft al een account.","auth/network-request-failed":"Verbinding mislukt. Probeer het opnieuw.","auth/too-many-requests":"Te veel pogingen. Probeer het later opnieuw."};
   authErr=errors[e.code]||"Inloggen of registreren is mislukt. Probeer het opnieuw.";
   render();
   $('#auth [name="m"]').value=v.m;
  }finally{for(const button of actions)button.disabled=false}
  return}
 if(f.id=="strength-weight"){saveWeight(f.elements.weight.value);return}
 if(f.id=="nm"){const n=f.elements.n.value.replace(/["<>&\\]/g,"").trim();if(n)start(n);return}
 if(f.id=="addx"){const n=f.elements.n.value.replace(/["<>&\\]/g,"").trim();const all=D().flatMap(d=>d.ex);
  if(!n)return;if(all.some(a=>a.toLowerCase()==n.toLowerCase())){toast("Die oefening bestaat al");return}
  S.c=(S.c||[]).filter(c=>c.n!=n);S.c.push({n,t:f.elements.t.value,g:f.elements.g.value});D()[tab].ex.push(n);save();render();toast("Oefening toegevoegd ✓");return}
 const nm=f.dataset.x;if(!nm)return;const x=K(nm),v=Object.fromEntries(new FormData(f));
 const n={id:uid(),x,d:v.d||today()};
 if(v.nt&&v.nt.trim())n.nt=v.nt.replace(/["<>&]/g,"").trim();
 let previous=null,record=false;
 if(v.t)n.t=v.t.trim();
 else{
  n.kg=parseFloat(String(v.kg).replace(",","."));
  n.r=parseInt(v.r);
  n.rm=v.rm?1:0;
  previous=n.rm?S.e.filter(entry=>entry.x===x&&entry.rm).reduce((max,entry)=>!max||Number(entry.kg)>Number(max.kg)?entry:max,null):best(x);
  record=Boolean(previous&&Number.isFinite(n.kg)&&(n.rm?n.kg>previous.kg:better(n,previous)));
 }
 markSession(n);
 if(record)n.pr=true;
 const ns=Math.max(1,Math.min(10,parseInt(v.ns)||1)),xb=snap();
 S.e.push(n);
 if(!n.rm)for(let k=1;k<ns;k++){
  const {pr,...repeat}=n;
  S.e.push({...repeat,id:uid()});
 }
 open[nm]=0;save();render();
 const tp=n.rm?[]:tips(x,n);lvu(xb,tp);
 const message=n.rm?"1RM opgeslagen ✓":"Opgeslagen ✓";
 toast([message+(ns>1&&!n.rm?" ("+ns+" sets)":""),...tp].join("\n"),tp.length?6000:2200);
 if(record)showPr(n,previous);
});
function saveWeight(value) {
 S.bw=parseFloat(String(value).replace(",","."))||0;
 if(S.bw>0){
  S.bwh=(S.bwh||[]).filter(e=>e.d!=today());
  S.bwh.push({d:today(),kg:S.bw});
 }
 save();render();toast("Lichaamsgewicht opgeslagen ✓");
}
document.addEventListener("input",ev=>{
 if(ev.target.id!=="strength-timeline")return;
 const date=stepDate(ev.target.value);
 const label=new Intl.DateTimeFormat("nl-NL",{dateStyle:"medium",timeZone:"UTC"}).format(new Date(date+"T00:00:00Z"));
 ev.target.setAttribute("aria-valuetext",label);
 $('output[for="strength-timeline"]').textContent=label;
});
document.addEventListener("change",ev=>{
 if(ev.target.id==="strength-timeline"){
  const date=stepDate(ev.target.value);
  strengthDate=date===today()?"":date;
  render();
 }
 if(ev.target.id==="bw"&&!ev.target.closest("#strength-weight"))saveWeight(ev.target.value);
});
</script></body></html>
