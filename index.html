html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:22px;margin:6px 4px 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{flex:1;white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}

.nm{font-weight:650}
.pr{font-size:12px;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);border-radius:8px;padding:3px 8px;white-space:nowrap}
.last{color:var(--mu);font-size:14px;margin-top:4px}
.up{color:var(--ok)}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:10px;padding:8px;font-size:14px}
.row button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
form{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
form label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
form select{font-size:16px;padding:9px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);width:100%}
form input{font-size:16px;padding:9px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);width:100%}
form .w{grid-column:1/3}
form .chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--tx)}
form .chk input{width:auto}
form button{grid-column:1/3;background:var(--ok);color:#fff;border:0;border-radius:10px;padding:11px;font-size:16px}
.ch{margin-top:10px}.ch svg{width:100%;height:auto;display:block}.ch .t{font-size:11px;fill:var(--mu)}.ch .v{font-size:12px;fill:var(--tx);font-weight:600}.ch p{font-size:12px;color:var(--mu);margin:4px 0 0}
.mv button{border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:8px;padding:4px 11px;margin-left:4px;font-size:14px}
.bw{display:flex;align-items:center;gap:8px;margin:2px 4px 8px;color:var(--mu);font-size:14px}.bw input{width:80px;font-size:16px;padding:7px;border:1px solid var(--ln);border-radius:9px;background:var(--card);color:var(--tx)}
#wr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;padding:28px;color:#fff;text-align:center;user-select:none}
.wb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;gap:4px}.wb i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.wb i.on{background:#fff}
.wx{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:14px;background:none;border:0;color:#fff;font-size:22px;padding:8px}
.wbig{font-size:68px;font-weight:800;line-height:1.05}.wbig2{font-size:34px;font-weight:800;line-height:1.15}.wsm{font-size:19px;opacity:.92;margin-top:12px;line-height:1.5}
.hist{margin-top:8px;font-size:14px}
.hist div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--ln)}
.hist i{font-style:normal;color:var(--mu)}
.hist b{color:var(--ac);font-weight:600}
.hist button{border:0;background:none;color:var(--mu);font-size:16px;padding:0 6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.s{opacity:1}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:18px}

 const draw=()=>{const c=WG[i%WG.length].split(",");el.style.background=`linear-gradient(160deg,${c[0]},${c[1]})`;el.innerHTML=`<div class="wb">${sl.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div><button class="wx" aria-label="Sluiten">✕</button>`+sl[i]};
 draw();
 el.onclick=ev=>{if(ev.target.closest(".wx")){el.remove();return}if(ev.clientX<innerWidth/3){if(i>0)i--}else if(i<sl.length-1)i++;else{el.remove();return}draw()}}
const isT=n=>n=="Plank"||(S.c||[]).some(c=>c.n==n&&c.t=="t");
let ordering=false;
function list(){const b=DAYS[tab].ex.filter(n=>!(S.h||[]).includes(n)).concat((S.c||[]).filter(c=>c.d==tab).map(c=>c.n)),o=(S.o||{})[tab]||[],p=a=>o.indexOf(a)<0?999+b.indexOf(a):o.indexOf(a);return b.slice().sort((x,y)=>p(x)-p(y))}
function start(n){S.n=n;S.e=n=="Tygo"?seed():n=="Tim"?seed(SEEDT):[];pick=0;save();render()}
function render(){if(!user){$("#tabs").innerHTML="";$("#list").innerHTML=`<div class="card"><div class="nm">Inloggen</div><form id="auth"><label class="w">E-mail<input name="m" type="email" required autocomplete="email"></label><label class="w">Wachtwoord (min. 6 tekens)<input name="p" type="password" minlength="6" required autocomplete="current-password"></label><button value="in">Inloggen</button><button value="new" style="background:var(--ac)">Account maken</button></form><div class="last">${authErr}</div></div>`;return}
 if(pick){$("#tabs").innerHTML="";$("#list").innerHTML=`<div class="card"><div class="nm">Wie ben je?</div><div class="last">Kies je naam, dan start je met je eigen schema. Wat je logt blijft alleen van jou.</div><div class="row"><button class="p" data-s="Tygo">Tygo</button><button class="p" data-s="Tim">Tim</button></div></div>`;return}
 document.querySelector("h1").textContent="🏋️ Gym Tracker"+(S.n?" · "+S.n:"");$("#tabs").innerHTML=DAYS.map((d,i)=>`<button class="${i==tab?"on":""}" data-t="${i}">${d.t}</button>`).join("")+`<button class="${tab==4?"on":""}" data-t="4">🎁 Wrapped</button>`;
 if(tab==4){$("#list").innerHTML=wview();return}
 $("#list").innerHTML=`<div class="bw">⚖️ Lichaamsgewicht <input id="bw" type="number" inputmode="decimal" step="any" value="${S.bw||""}"> kg</div><div class="row" style="margin-top:0"><button data-ord="1">${ordering?"✓ Klaar":"✎ Aanpassen"}</button></div>`+list().map(card).join("")+`<div class="card"><form id="addx"><label class="w">Eigen oefening toevoegen aan deze dag<input name="n" placeholder="bijv. Biceps Curl cable" required maxlength="40"></label><label class="w">Meten in<select name="t"><option value="kg">Gewicht × reps</option><option value="t">Tijd (bijv. plank, dead hang)</option></select></label><button>+ Toevoegen</button></form></div>`}
document.addEventListener("click",ev=>{const t=ev.target;if(t.closest("#wr"))return;const wp=t.closest("[data-wp]");if(wp){story(+wp.dataset.wp);return}const wb=t.closest("[data-wy]");if(wb){wy=+wb.dataset.wy;render();return}
 if(t.id=="lo"){ev.preventDefault();signOut(auth)}
 else if(t.dataset.ord){ordering=!ordering;render()}
 else if(t.dataset.mv){const[n,d]=t.dataset.mv.split("|"),l=list(),i=l.indexOf(n),j=i+ +d;if(j>=0&&j<l.length){[l[i],l[j]]=[l[j],l[i]];S.o=S.o||{};S.o[tab]=l;save();render()}}
 else if(t.dataset.ty){const c=S.c.find(c=>c.n==t.dataset.ty);if(c){c.t=c.t=="t"?"kg":"t";save();render();toast(c.t=="t"?"Nu op tijd":"Nu op gewicht × reps")}}
 else if(t.dataset.xd){const n=t.dataset.xd;if(confirm("Deze oefening verwijderen? Je sets van deze oefening worden ook verwijderd.")){
  if((S.c||[]).some(c=>c.n==n))S.c=S.c.filter(c=>c.n!=n);else S.h=(S.h||[]).concat(n);
  const vis=DAYS.flatMap(d=>d.ex).filter(a=>!(S.h||[]).includes(a)).concat((S.c||[]).map(c=>c.n));
  if(!vis.some(a=>K(a)==K(n)))S.e=S.e.filter(e=>e.x!=K(n));save();render()}}
 else if(t.dataset.s){start(t.dataset.s)}
 else if(t.dataset.t!=null){tab=+t.dataset.t;render()}
 else if(t.dataset.f){open[t.dataset.f]=open[t.dataset.f]=="f"?0:"f";render()}
 else if(t.dataset.c){open[t.dataset.c]=open[t.dataset.c]=="c"?0:"c";render()}
 else if(t.dataset.h){open[t.dataset.h]=open[t.dataset.h]=="h"?0:"h";render()}
 else if(t.dataset.del&&confirm("Deze set verwijderen?")){S.e=S.e.filter(e=>e.id!=t.dataset.del);save();render()}});
document.addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target;
 if(f.id=="auth"){const v=Object.fromEntries(new FormData(f));authErr="";try{await(ev.submitter.value=="new"?createUserWithEmailAndPassword:signInWithEmailAndPassword)(auth,v.m,v.p)}catch(e){authErr="Mislukt ("+e.code.replace("auth/","")+")";render()}return}
 if(f.id=="addx"){const n=f.n.value.replace(/["<>&\\]/g,"").trim();const all=DAYS.flatMap(d=>d.ex).filter(a=>!(S.h||[]).includes(a)).concat((S.c||[]).map(c=>c.n));
  if(!n)return;if(all.some(a=>a.toLowerCase()==n.toLowerCase())){toast("Die oefening bestaat al");return}
  S.c=S.c||[];S.c.push({n,d:tab,t:f.t.value});save();render();toast("Oefening toegevoegd ✓");return}
 const nm=f.dataset.x,x=K(nm),v=Object.fromEntries(new FormData(f));
 const n={id:uid(),x,d:v.d||today()};if(v.nt&&v.nt.trim())n.nt=v.nt.replace(/["<>&]/g,"").trim();let msg="Opgeslagen ✓";
 if(v.t)n.t=v.t.trim();else{n.kg=parseFloat(String(v.kg).replace(",","."));n.r=parseInt(v.r);n.rm=v.rm?1:0;
  if(n.rm)msg="Nieuwe 1RM opgeslagen 🏆";else{const b=best(x);if(b&&better(n,b))msg="Nieuw PR! 🔥"}}
 S.e.push(n);open[nm]=0;save();render();toast(msg)});
document.addEventListener("change",ev=>{if(ev.target.id=="bw"){S.bw=parseFloat(String(ev.target.value).replace(",","."))||0;save();render();toast("Lichaamsgewicht opgeslagen ✓")}});
</script></body></html>
